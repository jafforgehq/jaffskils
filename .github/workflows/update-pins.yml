name: update-pins
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move pins to upstream HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-pins.sh
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && { echo "Pins are current."; exit 0; }
          branch="update-pins-$(date +%Y-%m)"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: update upstream pins"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: update upstream pins ($(date +%Y-%m))" \
            --body "Monthly pin refresh. Read the diff, check upstream changelogs, then merge."
