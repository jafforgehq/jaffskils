name: update-pins
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Moves every pin to upstream HEAD and commits straight to the branch, but only
# after the same checks ci.yml runs have passed against the new pins.
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move pins to upstream HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-pins.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Validate manifest
        run: claude plugin validate .
      - name: Lint marketplace.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/marketplace-lint.sh --remote
      - name: Run lint tests
        run: tests/test-lint.sh
      - name: Run tests
        run: tests/test-setup.sh
      - name: Run sync tests
        run: tests/test-sync.sh
      - name: Commit the new pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && { echo "Pins are current."; exit 0; }
          scripts/pin-changelog.sh > "$RUNNER_TEMP/pin-changelog.md"
          cat "$RUNNER_TEMP/pin-changelog.md" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          { printf 'chore: update upstream pins\n\n'; cat "$RUNNER_TEMP/pin-changelog.md"; } | git commit -a -F -
          git push origin HEAD
